# Tag normalization map for opendataphilly-jkan
# Format: "raw tag as it appears in dataset files": "canonical label"
#
# How the tag system fits together:
#   1. This file (tag_normalization.yml) — raw → canonical mapping. Edit here
#      to fold a misspelling/synonym into an existing canonical tag, or to
#      introduce a new canonical tag.
#   2. _data/tags.yml — the canonical registry (slug + display label) used by
#      Jekyll and the tag filter UI. Any *new* canonical value added here must
#      also be added to _data/tags.yml so the UI knows about it.
#   3. scripts/normalize_tags.py — rewrites the `tags:` block in every
#      _datasets/*.md to use canonical values. Run after editing this file,
#      and after harvesting datasets that introduce new raw tags.
#
# Note: keyword *synonyms* for search (the `keywords:` field) are generated
# automatically by the enrich-keywords GHA workflow — do not add them here.
