dataset_fields:
  - field_name: title
    label: Title
    datajson: title
    jsonld: name
  - field_name: organization
    label: Organization
    datajson: publisher.name
    jsonld: publisher.name
  - field_name: notes
    label: Description
    datajson: description
    jsonld: description
  - field_name: area_of_interest
    label: Area of Interest
    jsonld: spatialCoverage.name
  - field_name: created
    label: Created
    display_template: display/date.html
    jsonld: datePublished
  - field_name: category
    label: Category
    display_template: display/category.html
    datajson: category
  - field_name: license
    label: License
    datajson: license
    display_template: display/license.html
    jsonld: license
  - field_name: maintainer
    label: Maintainer
    datajson: contactPoint.fn
    jsonld: contactPoint.name
  - field_name: maintainer_email
    label: Maintainer Email
    datajson: contactPoint.hasEmail
    display_template: display/maintainer_email.html
    jsonld: contactPoint.email
  - field_name: maintainer_link
    label: Maintainer Link
    display_template: display/maintainer_link.html
    jsonld: contactPoint.url
  - field_name: maintainer_phone
    label: Maintainer Phone
    jsonld: contactPoint.telephone
  - field_name: metadata_modified
    label: Metadata Last Updated
    datajson: metadata_modified
    display_template: display/date.html
  - field_name: modified
    label: Data Last Updated
    datajson: modified
    display_template: display/date.html
    jsonld: dateModified
  - field_name: source
    label: Source
  - field_name: time_period
    label: Time Period
  - field_name: usage
    label: Usage

resource_fields:
  - field_name: name
    label: Resource Name
    datajson: distribution.title
    jsonld: distribution.name
  - field_name: url
    label: URL
    datajson: distribution.downloadURL
    jsonld: distribution.contentUrl
  - field_name: format
    label: Format
    datajson: distribution.format
    jsonld: distribution.encodingFormat
    values:
      - api
      - csv
      - json
      - geojson
      - html
      - kml
      - kmz
      - shp
      - xml

organization_fields:
  - field_name: title
    label: Title
  - field_name: description
    label: Description
  - field_name: logo
    label: Logo
  - field_name: website
    label: Website URL

category_fields:
  - field_name: name
    label: Name
  - field_name: logo
    label: Logo
  - field_name: logo_credit
    label: Logo Credit
  - field_name: featured
    label: Featured on Homepage
