title: OpenDataPhilly
greeting: Welcome to OpenDataPhilly
description: OpenDataPhilly is a catalog of open data in the Philadelphia region. In addition to being the official open data repository for the City of Philadelphia, it includes data sets from many organizations in the region.
logo: /img/odp-logo.png
hero_image: /img/homepage-hero.jpg

# Homepage hero slideshow
# Rotating images shown in the homepage hero banner. The slideshow only
# rotates when there are two or more entries; with a single entry it shows a
# static image. If this list is empty or removed, the `hero_image` above is
# used as a fallback. Add images to /img and reference them here.
hero_images:
  - image: /img/homepage-hero.jpg
    alt: Aerial view of the Philadelphia region
  # - image: /img/hero-2.jpg
  #   alt: Short description of this image for accessibility

strict_front_matter: true

# Site theme
jkan_theme: Default

# Dataset schema
schema: philadelphia

# Nav bar
navigation:
  - title: Datasets
    url: /datasets/
  - title: Organizations
    url: /organizations/
  - title: Categories
    url: /categories/
  - title: About
    url: /about/
  - title: FAQ
    url: /FAQ/

# Collections
collections:
  datasets:
    output: true
    permalink: /datasets/:path/
  organizations:
    output: true
    permalink: /organizations/:path/
  dataset_categories:
    output: true
    permalink: /categories/:path/
  licenses:
    output: true
    permalink: /licenses/:path/

# Collections (cont'd)
defaults:
  - scope:
      path: ""
      type: dataset_categories
    values:
      layout: category
  - scope:
      path: ""
      type: datasets
    values:
      layout: dataset
      category: Uncategorized
      organization: N/A
  - scope:
      path: ""
      type: organizations
    values:
      layout: organization

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM

# Google Analytics
google_analytics:
  enabled: true

# US Digital Analytics Program - https://analytics.usa.gov
digital_analytics_program:
  enabled: false
  agency: ""
  subagency: ""

# Hypothesis.io - Annotator
hypothesis:
  enabled: false

# Twitter
twittercard:
  enabled: false
  username: "@"

# Open Graph
opengraph:
  enabled: true

# Plugins
plugins:
  - "jekyll-github-metadata"
  - "jekyll-relative-links"
  - "jekyll-paginate-v2"
  - "jekyll-titles-from-headings"

# Exclude these files from the build
exclude:
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts/src
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - netlify
  - netlify.toml
  - .parcel-cache
  - docs
