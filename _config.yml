title: OpenDataPhilly
greeting: Welcome to OpenDataPhilly
description: OpenDataPhilly is a catalog of open data in the Philadelphia region. In addition to being the official open data repository for the City of Philadelphia, it includes data sets from many organizations in the region.
logo: /img/odp-logo.png
hero_image: /img/hero-images/hero-image-311-requests.png

# Homepage hero slideshow
# Images shown in the homepage hero banner. The slideshow crossfades between
# entries and only rotates when there are two or more; with a single entry it
# shows a static image. If this list is empty or removed, the `hero_image`
# above is used as a fallback.
#
# To add a new hero image:
#   1. Add the image file to /img/hero-images/ (see that folder's README.txt
#      for size and format guidance).
#   2. Add an entry below with:
#        image  - path to the file (required)
#        alt    - short description for screen readers (required)
#        url    - link to the related dataset in the catalog (optional; when
#                 set, a "View related dataset" link appears over the image)
hero_images:
  - image: /img/hero-images/hero-image-311-requests.png
    alt: 311 service and information requests dashboard
    url: https://opendataphilly.org/datasets/311-service-and-information-requests/
  - image: /img/hero-images/hero-image-election-results.png
    alt: Philadelphia primary election results
    url: https://opendataphilly.org/datasets/election-results/
  - image: /img/hero-images/hero-image-noaa-temperature.png
    alt: Daily temperature records for the Philadelphia area
    url: https://opendataphilly.org/datasets/nowdata-noaa-online-weather-data/
  - image: /img/hero-images/hero-image-rf-childcare.png
    alt: Map of certified childcare locations and demographics
    url: https://opendataphilly.org/datasets/reinvestment-fund-childcare-map/
  - image: /img/hero-images/hero-image-building-energy.png
    alt: Philadelphia building energy performance dashboard
    url: https://opendataphilly.org/datasets/large-building-energy-benchmarking-data/
  - image: /img/hero-images/hero-image-property3.png
    alt: Property assessment with aerial imagery
    url: https://opendataphilly.org/datasets/philadelphia-properties-and-assessment-history/
  - image: /img/hero-images/hero-image-property2.png
    alt: Property assessment with street map
    url: https://opendataphilly.org/datasets/philadelphia-properties-and-assessment-history/
  - image: /img/hero-images/hero-image-property.png
    alt: City of Philadelphia property assessment
    url: https://opendataphilly.org/datasets/philadelphia-properties-and-assessment-history/
  - image: /img/hero-images/hero-image-city-budget.png
    alt: City of Philadelphia budget data
    url: https://opendataphilly.org/datasets/acouch-philadelphia-budget-data/
  - image: /img/hero-images/hero-image-openmaps.png
    alt: Philadelphia OpenMaps interactive map layers
    url: https://opendataphilly.org/datasets/openmaps/
  - image: /img/hero-images/hero-image-philaplace.png
    alt: PhilaPlace neighborhood history map
    url: https://opendataphilly.org/datasets/hsp-philaplace/
  - image: /img/hero-images/hero-image-phillyhistory.png
    alt: PhillyHistory historical photo map
    url: https://opendataphilly.org/datasets/phillyhistoryorg/
  - image: /img/hero-images/hero-image-breathe-philly.png
    alt: Breathe Philly air quality data
    url: https://opendataphilly.org/datasets/dph-breathe-philly/
  - image: /img/hero-images/hero-image-nhand-shootings-dashboard.png
    alt: Philadelphia shooting victims dashboard
    url: https://opendataphilly.org/datasets/nhand-philadelphia-gun-violence-dashboard/
  - image: /img/hero-images/hero-image-fair-measure.png
    alt: Fair Measure data visualization
    url: https://opendataphilly.org/datasets/nhand-property-fair-measure/
  - image: /img/hero-images/hero-image-progress-phl.png
    alt: Progress PHL indicators dashboard
    url: https://opendataphilly.org/datasets/controller-progress-phl/


strict_front_matter: true

# Site theme
jkan_theme: Default

# Dataset schema
schema: philadelphia

# Nav bar
navigation:
  - title: Datasets
    url: /datasets/
  - title: Organizations
    url: /organizations/
  - title: Categories
    url: /categories/
  - title: About
    url: /about/
  - title: FAQ
    url: /FAQ/

# Collections
collections:
  datasets:
    output: true
    permalink: /datasets/:path/
  organizations:
    output: true
    permalink: /organizations/:path/
  dataset_categories:
    output: true
    permalink: /categories/:path/
  licenses:
    output: true
    permalink: /licenses/:path/

# Collections (cont'd)
defaults:
  - scope:
      path: ""
      type: dataset_categories
    values:
      layout: category
  - scope:
      path: ""
      type: datasets
    values:
      layout: dataset
      category: Uncategorized
      organization: N/A
  - scope:
      path: ""
      type: organizations
    values:
      layout: organization

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM

# Google Analytics
google_analytics:
  enabled: true

# US Digital Analytics Program - https://analytics.usa.gov
digital_analytics_program:
  enabled: false
  agency: ""
  subagency: ""

# Hypothesis.io - Annotator
hypothesis:
  enabled: false

# Twitter
twittercard:
  enabled: false
  username: "@"

# Open Graph
opengraph:
  enabled: true

# Plugins
plugins:
  - "jekyll-github-metadata"
  - "jekyll-relative-links"
  - "jekyll-paginate-v2"
  - "jekyll-titles-from-headings"
  - "jekyll-sitemap"

# Exclude these files from the build
exclude:
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts/src
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - netlify
  - netlify.toml
  - .parcel-cache
  - docs
